<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1330">
<title>Page not found | Kenchi Hilario</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1330;
    --text:#EAEEFB;
    --soft:#B4BCD6;
    --accent:#8C9BFF;
    --edge:#3A4373;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#E8ECFA;--text:#12162E;--soft:#555C7E;--accent:#4854D8;--edge:#A9B1D6}
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:clamp(20px,5vw,64px);
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    line-height:1.6;
  }
  .lost{width:min(100%,520px)}
  .lost-code{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .lost h1{
    margin:10px 0 14px;
    font-family:'Sora',system-ui,sans-serif;
    font-size:clamp(34px,8vw,56px);
    font-weight:800;
    line-height:1.05;
    letter-spacing:-.03em;
  }
  .lost p{max-width:44ch;color:var(--soft)}
  .lost-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .lost-links a{
    padding:12px 22px;
    border:1.5px solid var(--edge);
    border-radius:99px;
    color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:12.5px;
    letter-spacing:.08em;
    text-decoration:none;
    text-transform:uppercase;
    transition:background .18s ease-out,border-color .18s ease-out,color .18s ease-out;
  }
  .lost-links a:first-child{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .lost-links a:hover{border-color:var(--accent)}
  .lost-links a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <main class="lost">
    <p class="lost-code">Error 404</p>
    <h1>That page is not here.</h1>
    <p>The link may be old or mistyped. The portfolio itself is one click away.</p>
    <div class="lost-links">
      <a href="/">Back to portfolio</a>
      <a href="/#work">See projects</a>
    </div>
  </main>
</body>
</html>
